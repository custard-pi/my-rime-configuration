patch:
  schema_list:
    #- {schema: luna_pinyin_simp}
    #- {schema: luna_pinyin_fluency}
    - {schema: rime_frost}
    #- {schema: rime_frost_double_pinyin_flypy}

  # 因为只有一个方案，所以不需要折叠
  switcher/fold_options: false

  # Caps Lock 切换中英文
  # 新方法，采用keybinder/bindings节内的快捷键C-S-2来切换中英，从而确保其不与CapsLock状态关联
  # 需配合keyd等工具将CapsLock键映射为C-S-2
  ascii_composer:
    good_old_caps_lock: true
    switch_key:
      Caps_Lock: clear        # commit_code | commit_text | clear
      Shift_L: noop    # commit_code | commit_text | inline_ascii | clear | noop
      Shift_R: noop           # commit_code | commit_text | inline_ascii | clear | noop
      Control_L: noop         # commit_code | commit_text | inline_ascii | clear | noop
      Control_R: noop         # commit_code | commit_text | inline_ascii | clear | noop
      Menu: clear

  key_binder/bindings/+:
    # 翻页 , .
    - { when: paging, accept: comma, send: Page_Up }
    - { when: has_menu, accept: period, send: Page_Down }
    # ASCII mode
    - { when: always, accept: Control+Shift+2, toggle: ascii_mode }
    - { when: always, accept: Control+Shift+at, toggle: ascii_mode }
  punctuator:
    full_shape:
      ' ' : { commit: '　' }
      ',' : { commit: ， }
      '.' : { commit: 。 }
      '<' : [ 《, 〈, «, ‹ ,< ]
      '>' : [ 》, 〉, », › ,'>' ]
      '/' : [ ／, ÷ , / ]
      '?' : { commit: ？ }
      ';' : { commit: ； }
      ':' : { commit: ： }
      '''' : { pair: [ '‘', '’' ] }
      '"' : { pair: [ '“', '”' ] }
      '\' : [ 、, ＼ , \]
      '|' : [ ·, ｜, '§', '¦' , '|' ]
      '`' : ｀
      '~' : ～
      '!' : { commit: ！ }
      '@' : [ ＠, ☯ , '@' ]
      '#' : [ ＃, ⌘ , '#']
      '%' : [ ％, '°', '℃' , '%']
      '$' : [ ￥, '$', '€', '£', '¥', '¢', '¤' ]
      '^' : { commit: …… }
      '&' : ＆
      '*' : [ ＊, ·, ・, ×, ※, ❂ ,'*']
      '(' : （
      ')' : ）
      '-' : －
      '_' : ——
      '+' : ＋
      '=' : ＝
      '[' : [ 「, 【, 〔, ［ ,'[']
      ']' : [ 」, 】, 〕, ］ ,']']
      '{' : [ 『, 〖, ｛ ,'{']
      '}' : [ 』, 〗, ｝ ,'}']
    half_shape:
      ',' : '，'
      '.' : '。'
      '<' : [ 《, 〈, «, ‹ ,< ]
      '>' : [ 》, 〉, », › ,'>' ]
      '/' : /
      '?' : '？'
      ';' : '；'
      ':' : '：'
      '''' : { pair: [ '‘', '’' ] }
      '"' : { pair: [ '“', '”' ] }
      '\' : '、'
      '|' : '|'
      '`' : '`'
      '~' : '~'
      '!' : '！'
      '@' : '@'
      '#' : '#'
      '%' : '%'
      '$' : [ ¥, '$', '€', '£',  '¢', '¤' , ￥]
      '^' : '^'
      '&' : '&'
      '*' : '*'
      '(' : '（'
      ')' : '）'
      '-' : '-' # Hyphen
      '_' : [ ——, ……, _, –, ·, ・ ] # Em dash * 2, ellipsis, underscore, en dash, middle dot
      '+' : '+'
      '=' : '='
      '[' : [ '[', 【, ［, 「, 〔 , ( ]
      ']' : [ ']', 】, ］ , 」, 〕, ) ]
      '{' : [ '{', 〖, ｛, 『 ]
      '}' : [ '}', 〗, ｝, 』 ]